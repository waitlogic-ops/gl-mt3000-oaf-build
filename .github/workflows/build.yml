name: Compile GL-MT3000 OAF with requested vendor hash override
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mt3000-oaf-vendor-hash
  cancel-in-progress: false
env:
  OPENWRT_COMMIT: f5dae5ece4805730c5e2850f8aa84765af2f6b32
  OAF_COMMIT: b88fcb082597486a816187ec1e02812082161d5e
  EXPECTED_ABI: 9469a6c8c449c47e503c05678ea1559d
  EXPECTED_KERNEL: 6.12.94
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libelf-dev dwarves kmod jq bc
          mkdir -p evidence dist
      - name: Prepare pinned source and official vendor configuration
        shell: bash
        run: |
          set -euo pipefail
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"
          cp configs/feeds.buildinfo openwrt/feeds.conf
          # Public vendor feed at the date of the official config publication.
          echo 'src-git gl https://github.com/gl-inet/gl-feeds.git^c4323bcd7df9fedfb3de815664ed50fcb9efd35e' >> openwrt/feeds.conf
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tee ../evidence/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ../evidence/feeds-install.log
          git clone --depth 1 --branch v7.0.1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter
          test "$(git -C package/OpenAppFilter rev-parse HEAD)" = "$OAF_COMMIT"
          cp ../configs/config_mt3000_4.9.1-op25 .config
          echo 'CONFIG_PACKAGE_kmod-oaf=m' >> .config
          make defconfig 2>&1 | tee ../evidence/defconfig.log
          cp .config ../evidence/openwrt.config
          cp tmp/.packageinfo ../evidence/packageinfo.txt
          cp feeds.conf ../evidence/feeds.conf
          ./scripts/diffconfig.sh > ../evidence/config.diff
          git rev-parse HEAD > ../evidence/openwrt-commit.txt
          git -C package/OpenAppFilter rev-parse HEAD > ../evidence/oaf-commit.txt
          python3 ../scripts/config-audit.py ../configs/config_mt3000_4.9.1-op25 .config > ../evidence/config-normalization.txt
      - name: Apply user-requested vendor hash workaround
        run: |
          python3 scripts/apply-vendor-hash.py openwrt
          git -C openwrt diff -- include/kernel-defaults.mk > evidence/vendor-hash-override.patch
      - name: Configure kernel with release build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk=openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64
          curl -fL --retry 3 "https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/${sdk}.tar.zst" -o sdk.tar.zst
          echo "ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25  sdk.tar.zst" | sha256sum -c
          # Import only host utilities and compiler, never the vanilla kernel or config.
          tar --zstd -xf sdk.tar.zst "${sdk}/staging_dir"
          cp -a --remove-destination "${sdk}/staging_dir/." openwrt/staging_dir/
          cd openwrt
          export PATH="$PWD/staging_dir/host/bin:$PATH"
          make -C target/linux/mediatek -f Makefile -f "$GITHUB_WORKSPACE/scripts/audit-kernel.mk" TOPDIR="$PWD" TARGET_BUILD=1 audit-kernel-config V=s -j1 2>&1 | tee ../evidence/native-kernel-config.log
          kernel_dir=$(find build_dir -type d -name linux-6.12.94 -print -quit)
          cp "$kernel_dir/.config.set" ../evidence/kernel.config.set.native
          cp "$kernel_dir/.vermagic.native" ../evidence/kernel.vermagic.native
          cp "$kernel_dir/.vermagic" ../evidence/kernel.vermagic.package
          python3 ../scripts/apply-vendor-hash.py . --check
          git diff --exit-code -- include/kernel.mk include/package-pack.mk
      - name: Record native kernel ABI without blocking compilation
        run: bash scripts/abi-preflight.sh
      - uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-downloads-${{ env.OPENWRT_COMMIT }}
      - name: Compile kernel and module prerequisites using prepared toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          export PATH="$PWD/staging_dir/host/bin:$PATH"
          make -C target/linux/mediatek -f Makefile -f "$GITHUB_WORKSPACE/scripts/audit-kernel.mk" TOPDIR="$PWD" TARGET_BUILD=1 build-kernel-modules V=s -j$(nproc) 2>&1 | tee ../evidence/kernel.log
          kernel_dir=$(find build_dir -type d -name linux-6.12.94 -print -quit)
          test -n "$kernel_dir"
          cp "$kernel_dir/.config" ../evidence/kernel.config
          cp "$kernel_dir/.config.set" ../evidence/kernel.config.set
          cp "$kernel_dir/.vermagic" ../evidence/kernel.vermagic
          cp "$kernel_dir/Module.symvers" ../evidence/Module.symvers
          test "$(cat "$kernel_dir/.vermagic.native")" = "$(cat ../evidence/kernel-abi-preflight.txt)"
          test "$(grep '=[ym]' "$kernel_dir/.config.set" | LC_ALL=C sort | md5sum | cut -d ' ' -f1)" = "$(cat "$kernel_dir/.vermagic.native")"
          test "$(cat "$kernel_dir/.vermagic")" = "$EXPECTED_ABI"
          test "$(make -s -C "$kernel_dir" kernelversion)" = "$EXPECTED_KERNEL"
      - name: Compile only OAF package
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          export PATH="$PWD/staging_dir/host/bin:$PATH"
          # Build the native package records for OAF's transitive dependencies.
          # The kernel step has already compiled these modules. Do not bypass
          # dependency checks or synthesize .provides files.
          for dependency in kernel kmod-nf-reject kmod-nf-ipt kmod-nf-log kmod-nf-conntrack kmod-ipt-core kmod-ipt-conntrack; do
            make -C package/kernel/linux TOPDIR="$PWD" "$PWD/staging_dir/target-aarch64_cortex-a53_musl/pkginfo/$dependency.provides" V=s -j1 2>&1 | tee -a ../evidence/dependency-packaging.log
          done
          make -C package/OpenAppFilter/oaf TOPDIR="$PWD" compile V=s -j1 2>&1 | tee ../evidence/oaf-build.log
          bash ../scripts/verify-package.sh
      - name: Upload compiled APK with actual ABI report
        uses: actions/upload-artifact@v4
        with:
          name: kmod-oaf-GL-MT3000-vendor-hash-test
          path: dist/
          if-no-files-found: error
      - name: Preserve compiled files for diagnosis even if verification fails
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/unverified-build-output
          find openwrt/bin -name 'kmod-oaf-*.apk' -exec cp {} evidence/unverified-build-output/ \; 2>/dev/null || true
          find openwrt/build_dir -path '*/oaf/oaf.ko' -exec cp {} evidence/unverified-build-output/ \; 2>/dev/null || true
      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ github.run_attempt }}
          path: evidence/
          include-hidden-files: true
          if-no-files-found: warn
